 pc=ADAM();world.add(pc);cp=P[0];vy=0;onG=1;tm=0;dead=0;fc=0;won=0;yaw=0;pit=.45;dist=10;tgt.set(0,1.5,0);if(k)say(L[lang].lvm[k][0])}
function win(){won=1;const q=pc.position;confetti(q);confetti(tv.set(q.x,q.y+2,q.z));snd(1000,.6);
 ui(`<h2>🎉 ${t('win')}</h2><p>👼 ${L[lang].lvm[lv][2]}</p><p>⏱ ${tm.toFixed(1)}s · 💀 ${dead} · ${CI[lv]} ${fc}/${fr.length}</p>`+(lv<2?`<button onclick="obby(${lv+1})">${t('next')}</button>`:'')+`<button onclick="obby(${lv})">${t('again')}</button>`)}
function obU(dt,T){
 for(const f of fr)f.m.rotation.y+=dt*2;
 for(const p of P)if(p.amp){const nx=p.ox+Math.sin(T*.9+p.ph)*p.amp,d=nx-p.x;p.x=nx;p.g.position.x=nx-p.ox;if(sp==p&&onG)pc.position.x+=d}
 if(won)return;tm+=dt;
 const f=(keys.w||keys.ArrowUp||tp.u?1:0)-(keys.s||keys.ArrowDown||tp.d?1:0),r=(keys.d||keys.ArrowRight||tp.r?1:0)-(keys.a||keys.ArrowLeft||tp.l?1:0);
 let mx=-Math.sin(yaw)*f+Math.cos(yaw)*r,mz=-Math.cos(yaw)*f-Math.sin(yaw)*r;const l=Math.hypot(mx,mz);if(l>0){mx/=l;mz/=l;pc.rotation.y=Math.atan2(mx,mz)}
 const q=pc.position,py=q.y;q.x+=mx*6*dt;q.z+=mz*6*dt;
 if((keys[' ']||tp.j)&&onG){vy=9.5;snd(660,.1)}
 vy-=24*dt;q.y+=vy*dt;onG=0;
 if(vy<=0)for(const p of P)if(py>=p.y-.15&&q.y<=p.y&&Math.hypot(q.x-p.x,q.z-p.z)<p.s/2+.1){q.y=p.y;vy=0;onG=1;sp=p;if(p.cp&&cp!=p){cp=p;snd(990,.2);say(L[lang].lvm[lv][1])}if(p.goal)win();break}
 if(q.y<(lv==1?cp.y-14:lv?-1.3:-3.5)){dead++;q.set(cp.x,cp.y+.5,cp.z);vy=0;snd(150,.4)}
 for(const f2 of fr)if(f2.m.visible&&Math.hypot(f2.m.position.x-q.x,f2.m.position.y-q.y-1,f2.m.position.z-q.z)<1.1){f2.m.visible=false;fc++;snd(1200,.1)}
 swing(pc,T,l>0?.8:0);tgt.lerp(tv.set(q.x,q.y+1.5,q.z),Math.min(1,dt*8));
 $('hud').textContent=`${t('day')} ${lv+3} · ⏱ ${tm.toFixed(1)}s · 💀 ${dead} · ${CI[lv]} ${fc}/${fr.length}`}

 yaw=0;pit=.5;dist=22;tgt.set(0,2,0);bt=1;
 if(m=='menu'){garden(1);show();menu()}
 if(m=='story'){garden(0);story()}
 if(m=='create'){garden(1);tool()}
 if(m=='quiz')quiz();
 if(m=='obby'){obby(0);help()}}
let last=0;
function loop(ms){requestAnimationFrame(loop);const T=ms/1000,dt=Math.min(.05,T-last);last=T;
 br+=(bt-br)*Math.min(1,dt*3);hemi.intensity=.12+.85*br;sun.intensity=.95*br;S.background.copy(C0).lerp(C1,br);
 anims=anims.filter(f=>!f(T,dt));
 if(mode=='obby')obU(dt,T);else if(mode=='menu')yaw+=dt*.12;
 orb();sky.position.copy(cam.position);sky.material.color.setScalar(.04+.96*br);sun.position.set(tgt.x+10,tgt.y+18,tgt.z+8);sun.target.position.copy(tgt);sun.target.updateMatrixWorld();R.render(S,cam)}
rs();applyLang();go('menu');requestAnimationFrame(loop);
